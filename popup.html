<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      width: 240px;
      padding: 14px;
      margin: 0;
    }

    h3 {
      margin: 0 0 12px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 12px;
      color: #444;
    }

    .value {
      float: right;
      color: #888;
    }

    input[type="range"] {
      width: 100%;
      margin-top: 4px;
    }

    p.hint {
      font-size: 11px;
      color: #999;
      margin-top: 14px;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <h3>🎧 Fade In Settings</h3>

  <label>Fade duration <span class="value" id="durationValue"></span></label>
  <input type="range" id="duration" min="500" max="6000" step="100" />

  <p class="hint">
    Curve: silent → quiet (0.1) → audible (0.2) → full volume.<br>
    Applies every time playback starts on music.youtube.com.
  </p>

  <script src="popup.js"></script>
</body>

</html>
